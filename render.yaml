services:
  - type: web
    name: farmdirect-mw-app
    runtime: python
    repo: https://github.com/MELISSAHZULU/farmdirect-mw-app
    plan: free
    region: oregon
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: cd backend && gunicorn farmdirect.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: farmdirect.settings
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: PAYCHANGU_MODE
        value: live
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        sync: false