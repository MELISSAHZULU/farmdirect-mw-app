name: farmdirect_mw_app
description: A fresh produce delivery platform for Lilongwe, Malawi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests for API calls
  http: ^1.1.0

  # State management
  provider: ^6.0.5

  # Secure local storage for tokens
  flutter_secure_storage: ^9.0.0

  # Image loading and caching
  cached_network_image: ^3.3.0

  # Loading spinners
  flutter_spinkit: ^5.2.0

  # Toast notifications
  fluttertoast: ^8.2.4

  # Pull to refresh (REPLACED)
  flutter_easyrefresh: ^2.2.2

  # For handling Date/Time formatting
  intl: ^0.18.1

  # For URL launcher (phone calls, WhatsApp)
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/